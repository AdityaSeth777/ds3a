<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraCalc — Modern Glassmorphism Calculator</title>
  <meta name="description" content="A sleek, modern, glassmorphic calculator with calculation history, dual-line display, and full keyboard support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <main class="calculator-app">
    <div class="calculator-card">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="window-controls" aria-hidden="true">
          <span class="control-dot red"></span>
          <span class="control-dot yellow"></span>
          <span class="control-dot green"></span>
        </div>
        <h1 class="calc-title">AuraCalc</h1>
        <div class="header-actions">
          <button id="btn-history-toggle" class="icon-button" title="Toggle Calculation History" aria-label="Toggle Calculation History" aria-expanded="false" aria-controls="history-panel">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Screen / Display -->
      <section class="calc-screen" aria-live="polite" aria-atomic="true">
        <div id="previous-expression" class="expression-display" aria-label="Previous expression"></div>
        <div class="current-display-container">
          <span id="active-operator" class="active-operator-badge" aria-hidden="true"></span>
          <div id="current-operand" class="result-display" aria-label="Current input or result">0</div>
        </div>
      </section>

      <!-- Calculator Keypad Grid -->
      <section class="calc-keypad" role="group" aria-label="Calculator Keypad">
        <!-- Row 1 -->
        <button id="btn-clear" class="btn btn-action" data-action="clear" aria-label="Clear All">AC</button>
        <button id="btn-delete" class="btn btn-action" data-action="delete" aria-label="Delete last digit">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button id="btn-percent" class="btn btn-action" data-action="percent" aria-label="Percent">%</button>
        <button id="btn-divide" class="btn btn-operator" data-operator="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button id="btn-7" class="btn btn-number" data-number="7">7</button>
        <button id="btn-8" class="btn btn-number" data-number="8">8</button>
        <button id="btn-9" class="btn btn-number" data-number="9">9</button>
        <button id="btn-multiply" class="btn btn-operator" data-operator="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button id="btn-4" class="btn btn-number" data-number="4">4</button>
        <button id="btn-5" class="btn btn-number" data-number="5">5</button>
        <button id="btn-6" class="btn btn-number" data-number="6">6</button>
        <button id="btn-subtract" class="btn btn-operator" data-operator="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button id="btn-1" class="btn btn-number" data-number="1">1</button>
        <button id="btn-2" class="btn btn-number" data-number="2">2</button>
        <button id="btn-3" class="btn btn-number" data-number="3">3</button>
        <button id="btn-add" class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button id="btn-plus-minus" class="btn btn-number" data-action="toggle-sign" aria-label="Change sign">±</button>
        <button id="btn-0" class="btn btn-number" data-number="0">0</button>
        <button id="btn-decimal" class="btn btn-number" data-action="decimal" aria-label="Decimal point">.</button>
        <button id="btn-equals" class="btn btn-equals" data-action="equals" aria-label="Calculate equals">=</button>
      </section>

      <!-- Collapsible Calculation History Drawer -->
      <aside id="history-panel" class="history-panel" aria-hidden="true">
        <div class="history-header">
          <div class="history-title-group">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h2>History</h2>
          </div>
          <button id="btn-clear-history" class="btn-text-danger" aria-label="Clear calculation history">Clear</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">No calculations yet</div>
        </div>
        <div class="history-footer-hint">Click any entry to restore result</div>
      </aside>
    </div>

    <!-- Keyboard Shortcuts Legend -->
    <footer class="shortcuts-legend">
      <span class="legend-item"><kbd>0</kbd>–<kbd>9</kbd> Numbers</span>
      <span class="legend-item"><kbd>+</kbd> <kbd>−</kbd> <kbd>*</kbd> <kbd>/</kbd> Operators</span>
      <span class="legend-item"><kbd>Enter</kbd> Equals</span>
      <span class="legend-item"><kbd>Esc</kbd> Clear</span>
      <span class="legend-item"><kbd>Backspace</kbd> Delete</span>
      <span class="legend-item"><kbd>H</kbd> History</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
